[package]
name = "qubit-config"
version = "0.16.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-config"
description = "Powerful type-safe configuration management with multi-value properties, variable substitution, and rich data type support"
homepage = "https://github.com/qubit-ltd/rs-config"
documentation = "https://docs.rs/qubit-config"
readme = "README.md"
keywords = ["config", "configuration", "settings", "properties", "qubit"]
categories = ["config", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/benches/**",
    "/src/**",
    "/tests/**",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "qubit_config"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
default = []
bigdecimal = ["dep:bigdecimal", "qubit-value/big-decimal"]
chrono = ["dep:chrono", "qubit-value/chrono"]
num-bigint = ["dep:num-bigint", "qubit-value/big-integer"]
url = ["dep:url", "qubit-value/url"]
env-file = ["dep:dotenvy"]
toml = ["dep:toml"]
yaml = ["dep:serde_norway"]
rich-types = ["bigdecimal", "chrono", "num-bigint", "url"]
formats = ["env-file", "toml", "yaml"]
full = ["rich-types", "formats"]

[dependencies]
qubit-budget = { version = "0.4", path = "../rs-budget", features = ["json"] }
qubit-json = { version = "0.7", path = "../rs-json" }
qubit-utils = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"], optional = true }
url = { version = "2.5", optional = true }
num-bigint = { version = "0.4", features = ["serde"], optional = true }
bigdecimal = { version = "0.4", features = ["serde"], optional = true }
toml = { version = "0.9", features = ["parse"], optional = true }
serde_norway = { version = "0.9", optional = true }
dotenvy = { version = "0.15", optional = true }

qubit-datatype = { version = "0.11", path = "../rs-datatype", default-features = false, features = ["converter"] }
qubit-redact = { version = "0.4", default-features = false }
qubit-value = { version = "0.10", path = "../rs-value", default-features = false, features = ["converter", "json"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tempfile = "3.27"

[[bench]]
name = "config_lookup_bench"
path = "benches/config_lookup_bench.rs"
harness = false

