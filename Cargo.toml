[package]
name = "qubit-config"
version = "0.14.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-config"
description = "Powerful type-safe configuration management with multi-value properties, variable substitution, and rich data type support"
homepage = "https://github.com/qubit-ltd/rs-config"
documentation = "https://docs.rs/qubit-config"
readme = "README.md"
keywords = ["config", "configuration", "settings", "properties", "qubit"]
categories = ["config", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "qubit_config"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
default = []
bigdecimal = ["dep:bigdecimal", "qubit-value/big-decimal"]
chrono = ["dep:chrono", "qubit-value/chrono"]
num-bigint = ["dep:num-bigint", "qubit-value/big-integer"]
url = ["dep:url", "qubit-value/url"]
env-file = ["dep:dotenvy"]
toml = ["dep:toml"]
yaml = ["dep:serde_norway"]
rich-types = ["bigdecimal", "chrono", "num-bigint", "url"]
formats = ["env-file", "toml", "yaml"]
full = ["rich-types", "formats"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.12"
chrono = { version = "0.4", features = ["serde"], optional = true }
url = { version = "2.5", optional = true }
num-bigint = { version = "0.4", features = ["serde"], optional = true }
bigdecimal = { version = "0.4", features = ["serde"], optional = true }
toml = { version = "0.9", features = ["parse"], optional = true }
serde_norway = { version = "0.9", optional = true }
dotenvy = { version = "0.15", optional = true }

qubit-datatype = { path = "../rs-datatype", version = "0.8", default-features = false, features = ["converter"] }
qubit-redact = { version = "0.3", path = "../rs-redact", default-features = false }
qubit-value = { path = "../rs-value", version = "0.10", default-features = false, features = ["converter", "json"] }

[dev-dependencies]
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
tempfile = "3.27"
qubit-value = { path = "../rs-value", version = "0.10", default-features = false, features = ["all"] }
url = "2.5"

[patch.crates-io]
qubit-datatype = { path = "../rs-datatype", version = "0.8" }

[[test]]
name = "composite_config_source_tests"
