[package]
name = "downstream-config-adapters"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
full = ["qubit-config/full"]

[dependencies]
qubit-config = { path = "../../../", version = "0.15", default-features = false }
qubit-http = { path = "../../../../rs-http", version = "0.16", default-features = false }
qubit-ioc = { path = "../../../../rs-ioc", version = "0.4", default-features = false, features = ["config"] }
qubit-websocket = { path = "../../../../rs-websocket", version = "0.3", default-features = false, features = ["config"] }
serde = { version = "^1.0", features = ["derive"] }

[patch.crates-io]
tungstenite = { git = "https://github.com/qubit-ltd/tungstenite-rs", rev = "b24a4442be0247a71fe9ee4e520eb483ac1b2873" }
