[package]
name = "qubit-config-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-config = { path = "..", features = ["full"] }
serde_json = "1.0"

[[bin]]
name = "properties_parser"
path = "fuzz_targets/properties_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interpolation"
path = "fuzz_targets/interpolation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_wire"
path = "fuzz_targets/config_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "toml_source"
path = "fuzz_targets/toml_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_source"
path = "fuzz_targets/yaml_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "env_file_source"
path = "fuzz_targets/env_file_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_deserialize"
path = "fuzz_targets/structured_deserialize.rs"
test = false
doc = false
bench = false
