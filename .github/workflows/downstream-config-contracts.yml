name: Downstream config contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-adapter-contracts:
    name: Real rs-http, rs-ioc, and rs-websocket config adapters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout rs-config under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: rs-config

      - name: Checkout fixed adapter source repositories
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-http
          ref: 1a8a2de33c8adbcc4bb7209823d870e596c08c7e
          fetch-depth: 0
          path: rs-http

      - name: Checkout fixed adapter source repositories
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-ioc
          ref: 49dccd37a58e322c1a430be37b470afe88b6ffaa
          fetch-depth: 0
          path: rs-ioc

      - name: Checkout fixed adapter source repositories
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-redact
          ref: d3116d19fc40d6e23db0fdca4db3748d0dede7d8
          fetch-depth: 0
          path: rs-redact

      - name: Checkout fixed adapter source repositories
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-websocket
          ref: e62a8437eb60fab664f781ef6d344041d713a601
          fetch-depth: 0
          path: rs-websocket

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0

      - name: Check downstream metadata validator
        working-directory: rs-config
        run: python3 -B scripts/check_downstream_contracts_tests.py

      - name: Check all three downstream adapters in both modes
        working-directory: rs-config
        run: python3 -B scripts/check-downstream-contracts.py
