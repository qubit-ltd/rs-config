name: Downstream config contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-adapter-contracts:
    name: Real rs-http and rs-ioc config adapters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout rs-config under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: rs-config

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0

      - name: Check downstream fixture metadata and run both modes
        working-directory: rs-config
        run: python3 -B scripts/check-downstream-contracts.py
