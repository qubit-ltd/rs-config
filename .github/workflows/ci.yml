name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  windows-env-source:
    name: Windows environment source tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rs-config
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: rs-config
      - name: Checkout locked rs-value path dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-value
          ref: 6f5ae6e2acd592dcb07d30b232b84735e1cc592d
          path: rs-value
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Verify locked rs-value path dependency version
        shell: pwsh
        run: |
          $lock = Get-Content Cargo.lock -Raw
          $lockedValue = [regex]::Match($lock, '(?s)\[\[package\]\]\s+name = "qubit-value"\s+version = "([^"]+)"')
          if (-not $lockedValue.Success) {
            throw "Cargo.lock does not contain the qubit-value package."
          }
          $value = Select-String -Path ../rs-value/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($value.Matches[0].Groups[1].Value -ne $lockedValue.Groups[1].Value) {
            throw "Checked out rs-value version does not match Cargo.lock ($($lockedValue.Groups[1].Value))."
          }
      - name: Run Windows environment source unit tests
        run: cargo +1.94.0 test --locked --lib source::env_config_source
      - name: Run Windows environment source public API tests
        run: cargo +1.94.0 test --locked --test env_config_source_tests

  coverage-files:
    name: Per-file coverage
    needs: rust-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download coverage report from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-reports
          path: artifacts/coverage

      - name: Check per-file coverage
        run: python3 -B scripts/check-coverage-files.py artifacts/coverage/coverage.json --config .infra/coverage/coverage.json

  config-32bit:
    name: Config 32-bit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rs-config
    env:
      CARGO_TARGET_DIR: target/i686-contracts
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-m32
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: rs-config
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-redact
          ref: a9b9d767d33b80541a743e19ce1e39afb3c0c29f
          path: rs-redact
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: qubit-ltd/rs-value
          ref: 6f5ae6e2acd592dcb07d30b232b84735e1cc592d
          path: rs-value
      - name: Install 32-bit build environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib libc6-dev-i386
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add --toolchain 1.94.0 i686-unknown-linux-gnu
          rustc +1.94.0 --print cfg --target i686-unknown-linux-gnu
      - name: Default-feature contracts
        run: >-
          cargo +1.94.0 test --locked --target i686-unknown-linux-gnu
          --test from_config_tests --test downstream_contract_tests
      - name: All-feature contracts
        run: >-
          cargo +1.94.0 test --locked --target i686-unknown-linux-gnu
          --all-features --test from_config_tests --test downstream_contract_tests
